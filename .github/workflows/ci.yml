name: PeerLink CI Baseline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forbidden-dependencies:
    name: Verify Architectural Boundaries & Forbidden Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run forbidden dependency check
        run: ./scripts/check-deps.sh

  java-core-and-desktop:
    name: Java Modules Compile & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Maven Enforcer and Compile Java Modules
        run: mvn clean test -B

  flutter-app:
    name: Flutter Application Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/peerlink-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --fatal-infos

      - name: Run widget tests
        run: flutter test

  protobuf-validation:
    name: Protobuf Contract Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '29.x'

      - name: Verify Proto file syntax
        run: |
          protoc --proto_path=protocol/proto \
                 protocol/proto/peerlink/v1/*.proto \
                 --descriptor_set_out=/dev/null
