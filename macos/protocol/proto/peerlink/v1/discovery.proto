syntax = "proto3";

package peerlink.v1;

import "peerlink/v1/common.proto";
import "peerlink/v1/capability.proto";

option java_package = "org.peerlink.protocol.v1";
option java_multiple_files = true;

enum DiscoveryEventType {
  DISCOVERY_EVENT_TYPE_UNSPECIFIED = 0;
  DISCOVERY_EVENT_TYPE_PEER_FOUND = 1;
  DISCOVERY_EVENT_TYPE_PEER_LOST = 2;
  DISCOVERY_EVENT_TYPE_PEER_UPDATED = 3;
}

message DiscoveredPeer {
  PeerId peer_id = 1;
  repeated string socket_addresses = 2;
  repeated FeatureCapability capabilities = 3;
  string display_name = 4;
  int64 last_seen_utc_ms = 5;
}

message DiscoveryEvent {
  DiscoveryEventType event_type = 1;
  DiscoveredPeer peer = 2;
  int64 timestamp_utc_ms = 3;
}
