syntax = "proto3";

package peerlink.v1;

option java_package = "org.peerlink.protocol.v1";
option java_multiple_files = true;

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNAUTHENTICATED = 1;
  ERROR_CODE_UNAUTHORIZED = 2;
  ERROR_CODE_INCOMPATIBLE_PROTOCOL_VERSION = 3;
  ERROR_CODE_UNSUPPORTED_CAPABILITY = 4;
  ERROR_CODE_OBJECT_NOT_FOUND = 5;
  ERROR_CODE_CONFLICT_DETECTED = 6;
  ERROR_CODE_INTEGRITY_MISMATCH = 7;
  ERROR_CODE_MALWARE_DETECTED = 8;
  ERROR_CODE_TRANSPORT_DISCONNECTED = 9;
  ERROR_CODE_RESOURCE_EXHAUSTED = 10;
  ERROR_CODE_OPERATION_CANCELLED = 11;
  ERROR_CODE_INTERNAL_ERROR = 12;
}

// Deterministic error model: machine-readable and human-explainable.
message ErrorDetail {
  ErrorCode code = 1;
  string error_name = 2;
  string human_summary = 3;
  string human_explanation = 4;
  string suggested_recovery_action = 5;
  bool is_retryable = 6;
  string trace_id = 7;
  int64 timestamp_utc_ms = 8;
  map<string, string> error_context = 9;
}
