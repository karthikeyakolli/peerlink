# PeerLink Relay Server Configuration (coturn)
# STUN and TURN relay infrastructure for NAT traversal when direct P2P is unavailable.
# Invariant: TURN is a relay path, NOT a security authority. All P2P payloads are E2E encrypted.

listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535

realm=peerlink.relay
fingerprint
lt-cred-mech
stale-nonce=600

# Authentication credentials (configure via environment or secrets in production)
# user=peerlink_user:replace_with_secure_password

# Logging
verbose
no-cli
log-file=stdout
