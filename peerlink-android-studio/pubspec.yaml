name: peerlink
description: "PeerLink Android Studio Edition - Privacy-first distributed personal data platform"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  protobuf: ^6.1.0
  grpc: ^5.1.0
  fixnum: ^1.1.0
  crypto: ^3.0.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
